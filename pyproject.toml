[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "anis-partners"
version = "1.0.0"
description = "The Python SDK for the Anis Partner API — signed requests, verified responses, typed operations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Aniscom for Technical Services (Anis)", email = "support@anis.ly" }]
keywords = ["anis", "libya", "partner-api", "http-signatures", "rfc9421", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27,<1",
    "opentelemetry-api>=1.25",
]

[project.urls]
Homepage = "https://developers.anis.ly"
Documentation = "https://developers.anis.ly"
Source = "https://github.com/anis-ly/anis.partners-sdk-python"
Issues = "https://github.com/anis-ly/anis.partners-sdk-python/issues"
Changelog = "https://github.com/anis-ly/anis.partners-sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "anyio>=4",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anis_partners"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "samples", "tools", "README.md", "LICENSE", "CHANGELOG.md", "contracts", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "tools", "samples"]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "tools/**/*.py", "samples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "PT", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
