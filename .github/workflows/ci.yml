name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --python ${{ matrix.python }}

      - name: Lint, format and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy

      - name: Tests (every conformance vector and every .NET twin)
        run: uv run pytest -q

      - name: Build the wheel and the source archive
        run: uv build
